    <path d="M74 167C92 154 101 137 114 132C129 126 141 136 152 127C167 115 173 91 198 87" stroke="url(#emerald)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 16"/>

