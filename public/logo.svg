<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#18181b"/>
  <!-- Winding road from origin to destination -->
  <path d="M6 27 C10 22 14 19 16 16 C18 13 22 9 26 5"
        stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Quest-style diamond (destination) -->
  <path d="M26 1 L30 5 L26 9 L22 5 Z" fill="#f59e0b"/>
  <!-- Origin circle (start) -->
  <circle cx="6" cy="27" r="2.5" fill="#f59e0b"/>
  <!-- Mid waypoint -->
  <circle cx="16" cy="16" r="1.8" fill="#92400e" stroke="#d97706" stroke-width="1"/>
</svg>
