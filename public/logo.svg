    <circle cx="122" cy="132" r="8" fill="#D7E6F5" stroke="#1C9B65" stroke-width="4"/>
    <circle cx="154" cy="126" r="8" fill="#D7E6F5" stroke="#1C9B65" stroke-width="4"/>
    <circle cx="198" cy="87" r="10" fill="#F3E7B3" stroke="#C7922E" stroke-width="5"/>

